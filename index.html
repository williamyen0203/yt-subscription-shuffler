<body>
  <h1>Youtube Subscription Shuffler</h1>

  <script>
    const API_KEY = "DO_NOT_COMIT";
    const CLIENT_ID = "DO_NOT_COMMIT";
    const CLIENT_SECRET = "DO_NOT_COMMIT";

    var GoogleAuth;
    var SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';
    function handleClientLoad() {
      // Load the API's client and auth2 modules.
      // Call the initClient function after the modules load.
      gapi.load('client:auth2', initClient);
    }
  
    function initClient() {
      // In practice, your app can retrieve one or more discovery documents.
      var discoveryUrl = 'https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest';
  
      // Initialize the gapi.client object, which app uses to make API requests.
      // Get API key and client ID from API Console.
      // 'scope' field specifies space-delimited list of access scopes.
      gapi.client.init({
          'apiKey': API_KEY,
          'clientId': CLIENT_ID,
          'discoveryDocs': [discoveryUrl],
          'scope': SCOPE,
          'plugin_name': 'yt-subscription-shuffler'
      }).then(function () {
        GoogleAuth = gapi.auth2.getAuthInstance();
  
        // Listen for sign-in state changes.
        GoogleAuth.isSignedIn.listen(updateSigninStatus);
  
        // Handle initial sign-in state. (Determine if user is already signed in.)
        var user = GoogleAuth.currentUser.get();
        setSigninStatus();
  
        // Call handleAuthClick function when user clicks on
        //      "Sign In/Authorize" button.
        $('#sign-in-or-out-button').click(function() {
          handleAuthClick();
        });
        $('#revoke-access-button').click(function() {
          revokeAccess();
        });
        $('#call-api').click(function() {
          callApi();
        });
      });
    }
  
    function handleAuthClick() {
      if (GoogleAuth.isSignedIn.get()) {
        // User is authorized and has clicked "Sign out" button.
        GoogleAuth.signOut();
      } else {
        // User is not signed in. Start Google auth flow.
        GoogleAuth.signIn();
      }
    }
  
    function revokeAccess() {
      GoogleAuth.disconnect();
    }

    async function callApi() {
      let subscriptionIdToNameMap = new Map();
      let nextPageToken = null;

      // get all subscriptions
      do {
        subscriptionData = await gapi.client.request({
          'path': "https://www.googleapis.com/youtube/v3/subscriptions?" +
          "part=snippet" +
          "&mine=true" +
          "&maxResults=50" +
          (nextPageToken == null ? "" : "&pageToken=" + nextPageToken)
        })

        nextPageToken = subscriptionData.result.nextPageToken;
        subscriptions = subscriptionData.result.items.forEach(item => {
          subscriptionIdToNameMap.set(item.snippet.resourceId.channelId, item.snippet.title)
        });
      } while (nextPageToken != null)

      // pick random channel
      const subscriptionIdsAsArray = Array.from(subscriptionIdToNameMap.keys())
      const randomSubscriptionId = subscriptionIdsAsArray[Math.floor(Math.random() * subscriptionIdsAsArray.length)];

      // get videos from channel
      let videoIdToTitleMap = new Map();
      do {
        const searchData = await gapi.client.request({
          'path': "https://www.googleapis.com/youtube/v3/search?" +
          "part=id,snippet" +
          "&maxResults=50" +
          "&order=date" +
          "&type=video" +
          "&channelId=" + randomSubscriptionId +
          (nextPageToken == null ? "" : "&pageToken=" + nextPageToken)
        });

        nextPageToken = searchData.result.nextPageToken;
        searchData.result.items.forEach(item => {
          videoIdToTitleMap.set(item.id.videoId, item.snippet.title);
        });
      } while (nextPageToken != null)

      // pick random video
      const videoIdsAsArray = Array.from(videoIdToTitleMap.keys());
      const randomVideoId = videoIdsAsArray[Math.floor(Math.random() * videoIdsAsArray.length)];

      // show video
      $('#player-iframe').attr('src', "https://www.youtube.com/embed/" + randomVideoId);
      
      $('#num-channels').text(subscriptionIdToNameMap.size);
      $('#num-videos').text(videoIdToTitleMap.size);
      $('#now-playing').text(videoIdToTitleMap.get(randomVideoId));
      $('#channel-name').text(subscriptionIdToNameMap.get(randomSubscriptionId));
    }
  
    function setSigninStatus() {
      var user = GoogleAuth.currentUser.get();
      var isAuthorized = user.hasGrantedScopes(SCOPE);
      if (isAuthorized) {
        $('#sign-in-or-out-button').html('Sign out');
        $('#revoke-access-button').css('display', 'inline-block');
        $('#call-api').css('display', 'inline-block');
        $('#auth-status').html('You are currently signed in and have granted ' +
            'access to this app.');
      } else {
        $('#sign-in-or-out-button').html('Sign In/Authorize');
        $('#revoke-access-button').css('display', 'none');
        $('#call-api').css('display', 'none');
        $('#auth-status').html('You have not authorized this app or you are ' +
            'signed out.');
      }
    }
  
    function updateSigninStatus() {
      setSigninStatus();
    }
  </script>
  
  <button id="sign-in-or-out-button">Sign In/Authorize</button>
  <button id="revoke-access-button">Revoke access</button>

  <button id="call-api">Call API</button>
  
  <div id="auth-status"></div><hr>

  <h2>Picking random video from <span id="num-channels">...</span> channels: <span id="channel-name">...</span></h2>
  <h2>Picking random video from channel with <span id="num-videos">...</span> videos: <span id="now-playing">...</span></h2>

  <iframe id="player-iframe" frameborder="0" height="600" width="800"></iframe>
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script async defer src="https://apis.google.com/js/api.js"
          onload="this.onload=function(){};handleClientLoad()"
          onreadystatechange="if (this.readyState === 'complete') this.onload()">
  </script>

  <style>
    #sign-in-or-out-button {
      margin-left: 25px;
    }

    #revoke-access-button {
      display: none;
      margin-left: 25px;
    }

    #call-api {
      display: none;
      margin-left: 25px;
    }

    #auth-status {
      display: inline;
      margin-left: 25px;
    }
    
    #results {
      white-space: pre-line;
      background-color: rgb(189, 189, 189);
    }
    
    #output {
      white-space: pre-line;
      background-color: rgb(139, 139, 139);
    }
  </style>
</body>
